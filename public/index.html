<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Univerzalni Rokovnik Pro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    html, body { width: 100%; overflow-x: hidden; background-color: #f0f2f5; color: #1c1e21; padding: 8px; }
    .container { width: 100%; max-width: 800px; margin: 0 auto; }
    
    .header-bar { background: #184173; color: white; padding: 12px 14px; border-radius: 10px; font-size: 1.1rem; font-weight: bold; display: flex; align-items: center; gap: 8px; margin-bottom: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
    
    .nav-tabs { display: flex; gap: 6px; margin-bottom: 10px; width: 100%; }
    .tab-btn { flex: 1; padding: 8px 4px; border: none; border-radius: 8px; background: #e4e6eb; font-weight: 600; font-size: 0.8rem; color: #4b4f56; cursor: pointer; text-align: center; white-space: nowrap; }
    .tab-btn.active { background: #2374e1; color: white; }

    .card { background: white; padding: 12px; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); margin-bottom: 12px; width: 100%; }
    .card-title { font-size: 1rem; font-weight: bold; color: #184173; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }

    .form-grid { display: flex; flex-direction: column; gap: 10px; width: 100%; }
    .form-group { display: flex; flex-direction: column; gap: 4px; width: 100%; }
    label { font-size: 0.8rem; font-weight: bold; color: #4b4f56; }
    input, select, textarea { width: 100%; padding: 8px 10px; border: 1px solid #ccd0d5; border-radius: 6px; font-size: 0.85rem; outline: none; }
    input:focus, select:focus, textarea:focus { border-color: #2374e1; }

    .file-inputs { display: flex; flex-direction: column; gap: 8px; width: 100%; }
    .file-inputs input[type="file"] { width: 100%; font-size: 0.75rem; }

    .btn-main { width: 100%; background: #2374e1; color: white; padding: 11px; border: none; border-radius: 8px; font-weight: bold; font-size: 0.95rem; cursor: pointer; margin-top: 10px; display: flex; justify-content: center; align-items: center; gap: 6px; }
    .btn-main:hover { background: #1b64c6; }

    .item-card { border-left: 4px solid #2374e1; background: #f8f9fa; border-radius: 8px; padding: 10px; margin-bottom: 10px; border-top: 1px solid #eee; border-right: 1px solid #eee; border-bottom: 1px solid #eee; width: 100%; word-break: break-word; }
    .item-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; gap: 6px; }
    .item-title { font-size: 0.95rem; font-weight: bold; color: #184173; word-break: break-word; }
    .badge { padding: 2px 6px; border-radius: 10px; font-size: 0.7rem; font-weight: bold; background: #e4e6eb; color: #4b4f56; flex-shrink: 0; }
    .badge.u-radu { background: #e7f3ff; color: #1877f2; }
    .badge.zavrsen { background: #e2f6ea; color: #2e7d32; }
    
    .item-details { font-size: 0.8rem; color: #606770; line-height: 1.4; margin-bottom: 8px; word-break: break-word; }
    .item-thumb { max-width: 100%; height: auto; max-height: 150px; object-fit: contain; border-radius: 6px; border: 1px solid #ccc; margin-top: 6px; display: block; }

    .actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 8px; }
    .btn-action { padding: 7px 4px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.75rem; color: white; text-align: center; text-decoration: none; display: flex; align-items: center; justify-content: center; }
    .btn-edit { background: #e67e22; }
    .btn-mail { background: #8e44ad; }
    .btn-delete { background: #e74c3c; }

    .search-input { width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 10px; font-size: 0.85rem; }
  </style>
</head>
<body>

<div class="container">
  <div class="header-bar">
    📋 Univerzalni Rokovnik Pro
  </div>

  <div class="nav-tabs">
    <button class="tab-btn active">📁 Predmeti</button>
    <button class="tab-btn" onclick="alert('Sekcija Rokovi stiže uskoro!')">📅 Rokovi</button>
    <button class="tab-btn" onclick="alert('Sekcija Analitika stiže uskoro!')">📊 Analitika</button>
  </div>

  <div class="card">
    <div class="card-title">➕ Unos Novog Predmeta</div>
    <form id="predmetForm">
      <input type="hidden" id="predmetId">
      <div class="form-grid">
        <div class="form-group">
          <label>Vrsta predmeta *</label>
          <select id="vrsta_predmeta">
            <option value="Opšti predmet / Zadatak">Opšti predmet / Zadatak</option>
            <option value="Objedinjena procedura">Objedinjena procedura</option>
            <option value="Urbanizam">Urbanizam</option>
            <option value="Ozren">Ozren</option>
          </select>
        </div>
        <div class="form-group">
          <label>Oznaka / Broj *</label>
          <input type="text" id="interni_broj" placeholder="INT-2026-01">
        </div>
        <div class="form-group">
          <label>Naziv predmeta *</label>
          <input type="text" id="naziv_predmeta" placeholder="Unesite naziv" required>
        </div>
        <div class="form-group">
          <label>Stranka / Investor</label>
          <input type="text" id="investor" placeholder="Ime stranke">
        </div>
        <div class="form-group">
          <label>Obrađivač</label>
          <input type="text" id="obradivac" placeholder="Obrađivač">
        </div>
        <div class="form-group">
          <label>Datum otvaranja *</label>
          <input type="date" id="datum_prijema">
        </div>
        <div class="form-group">
          <label>Krajnji rok</label>
          <input type="date" id="rok_datum">
        </div>
        <div class="form-group">
          <label>Status</label>
          <select id="status">
            <option value="U radu">U radu</option>
            <option value="Završen">Završen</option>
            <option value="Na čekanju">Na čekanju</option>
          </select>
        </div>
        <div class="form-group">
          <label>Potpisnik</label>
          <input type="text" id="potpisnik" placeholder="Potpisnik">
        </div>
        <div class="form-group">
          <label>Napomene</label>
          <textarea id="napomena" rows="2" placeholder="Napomena..."></textarea>
        </div>
        
        <div class="form-group">
          <div class="file-inputs">
            <div>
              <label>📷 Us slikaj kamerom</label>
              <input type="file" id="cameraFile" accept="image/*" capture="environment">
            </div>
            <div>
              <label>📁 Priloži dokument / galeriju</label>
              <input type="file" id="galleryFile" accept="image/*">
            </div>
          </div>
          <input type="hidden" id="slika_base64">
        </div>
      </div>

      <button type="submit" class="btn-main">💾 Sačuvaj Predmet</button>
    </form>
  </div>

  <div class="card">
    <div class="card-title">📁 Registar Predmeta</div>
    <input type="text" id="search" class="search-input" placeholder="Pretraži registar..." onkeyup="filtriraj()">
    <div id="listaPredmeta"></div>
  </div>
</div>

<script>
  let SVI_PREDMETI = [];

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('datum_prijema').valueAsDate = new Date();
    ucitajPredmete();
  });

  function obradiFajl(e) {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (evt) => {
        document.getElementById('slika_base64').value = evt.target.result;
      };
      reader.readAsDataURL(file);
    }
  }

  document.getElementById('cameraFile').addEventListener('change', obradiFajl);
  document.getElementById('galleryFile').addEventListener('change', obradiFajl);

  async function ucitajPredmete() {
    try {
      const res = await fetch('/api/predmeti');
      SVI_PREDMETI = await res.json();
      prikaziKartice(SVI_PREDMETI);
    } catch (err) {
      console.error(err);
    }
  }

  function prikaziKartice(podaci) {
    const kontekst = document.getElementById('listaPredmeta');
    kontekst.innerHTML = '';

    if (podaci.length === 0) {
      kontekst.innerHTML = '<p style="color:#777; text-align:center;">Nema unetih predmeta.</p>';
      return;
    }

    podaci.forEach(p => {
      const div = document.createElement('div');
      div.className = 'item-card';
      const statusClass = p.status === 'Završen' ? 'zavrsen' : 'u-radu';
      
      div.innerHTML = `
        <div class="item-header">
          <div class="item-title">${p.naziv_predmeta || 'Bez naziva'}</div>
          <span class="badge ${statusClass}">${p.status || 'U radu'}</span>
        </div>
        <div class="item-details">
          <b>Oznaka:</b> ${p.interni_broj || '-'}<br>
          <b>Vrsta:</b> ${p.vrsta_predmeta || '-'}<br>
          <b>Stranka:</b> ${p.investor || '-'}<br>
          <b>Obrađivač:</b> ${p.obradivac || '-'}<br>
          <b>Datum:</b> ${p.datum_prijema || '-'} | <b>Rok:</b> ${p.rok_datum || '-'}
          ${p.napomena ? `<br><i>Napomena: ${p.napomena}</i>` : ''}
        </div>
        ${p.slika_base64 ? `<img src="${p.slika_base64}" class="item-thumb" onclick="window.open('${p.slika_base64}')">` : ''}
        <div class="actions">
          <button class="btn-action btn-edit" onclick="izmeni(${p.id})">Izmeni</button>
          <a class="btn-action btn-mail" href="mailto:?subject=Predmet: ${encodeURIComponent(p.naziv_predmeta)}&body=Oznaka: ${encodeURIComponent(p.interni_broj)}">📧 Mail</a>
          <button class="btn-action btn-delete" onclick="obrisi(${p.id})">🗑️ Obriši</button>
        </div>
      `;
      kontekst.appendChild(div);
    });
  }

  document.getElementById('predmetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const payload = {
      id: document.getElementById('predmetId').value || null,
      vrsta_predmeta: document.getElementById('vrsta_predmeta').value,
      interni_broj: document.getElementById('interni_broj').value,
      naziv_predmeta: document.getElementById('naziv_predmeta').value,
      investor: document.getElementById('investor').value,
      obradivac: document.getElementById('obradivac').value,
      potpisnik: document.getElementById('potpisnik').value,
      datum_prijema: document.getElementById('datum_prijema').value,
      rok_datum: document.getElementById('rok_datum').value,
      status: document.getElementById('status').value,
      slika_base64: document.getElementById('slika_base64').value,
      napomena: document.getElementById('napomena').value
    };

    try {
      const res = await fetch('/api/predmeti', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (data.success) {
        resetForma();
        ucitajPredmete();
      }
    } catch (err) {
      alert('Greška pri čuvanju');
    }
  });

  function izmeni(id) {
    const p = SVI_PREDMETI.find(item => item.id === id);
    if (!p) return;
    document.getElementById('predmetId').value = p.id;
    document.getElementById('vrsta_predmeta').value = p.vrsta_predmeta || 'Opšti predmet / Zadatak';
    document.getElementById('interni_broj').value = p.interni_broj || '';
    document.getElementById('naziv_predmeta').value = p.naziv_predmeta || '';
    document.getElementById('investor').value = p.investor || '';
    document.getElementById('obradivac').value = p.obradivac || '';
    document.getElementById('potpisnik').value = p.potpisnik || '';
    document.getElementById('datum_prijema').value = p.datum_prijema || '';
    document.getElementById('rok_datum').value = p.rok_datum || '';
    document.getElementById('status').value = p.status || 'U radu';
    document.getElementById('slika_base64').value = p.slika_base64 || '';
    document.getElementById('napomena').value = p.napomena || '';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  async function obrisi(id) {
    if (!confirm('Obriši ovaj predmet?')) return;
    try {
      const res = await fetch('/api/obrisi', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id })
      });
      const data = await res.json();
      if (data.success) ucitajPredmete();
    } catch (err) {
      alert('Greška pri brisanju');
    }
  }

  function resetForma() {
    document.getElementById('predmetForm').reset();
    document.getElementById('predmetId').value = '';
    document.getElementById('slika_base64').value = '';
    document.getElementById('datum_prijema').valueAsDate = new Date();
  }

  function filtriraj() {
    const q = document.getElementById('search').value.toLowerCase();
    const filtrirano = SVI_PREDMETI.filter(p => 
      (p.naziv_predmeta && p.naziv_predmeta.toLowerCase().includes(q)) ||
      (p.investor && p.investor.toLowerCase().includes(q)) ||
      (p.interni_broj && p.interni_broj.toLowerCase().includes(q)) ||
      (p.obradivac && p.obradivac.toLowerCase().includes(q))
    );
    prikaziKartice(filtrirano);
  }
</script>
</body>
</html>
