<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Univerzalni Rokovnik Pro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; color: #333; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    h1 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
    .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
    .form-group { display: flex; flex-direction: column; }
    .form-group label { font-size: 0.85rem; font-weight: bold; margin-bottom: 5px; color: #555; }
    .form-group input, .form-group select, .form-group textarea { padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem; }
    .full-width { grid-column: 1 / -1; }
    .btn-container { display: flex; gap: 10px; margin-top: 15px; }
    button { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
    .btn-primary { background-color: #27ae60; color: white; }
    .btn-primary:hover { background-color: #219150; }
    .btn-danger { background-color: #e74c3c; color: white; }
    .btn-danger:hover { background-color: #c0392b; }
    .btn-secondary { background-color: #95a5a6; color: white; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
    th { background-color: #34495e; color: white; }
    tr:hover { background-color: #f1f1f1; }
    .search-box { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; }
    .thumb { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>

<div class="container">
  <h1>Univerzalni Rokovnik Pro</h1>

  <div class="card">
    <form id="predmetForm">
      <input type="hidden" id="predmetId">
      <div class="form-grid">
        <div class="form-group">
          <label>Vrsta predmeta</label>
          <input type="text" id="vrsta_predmeta" placeholder="Npr. Objedinjena procedura">
        </div>
        <div class="form-group">
          <label>Interni broj</label>
          <input type="text" id="interni_broj">
        </div>
        <div class="form-group">
          <label>Naziv predmeta</label>
          <input type="text" id="naziv_predmeta" required>
        </div>
        <div class="form-group">
          <label>Investitor</label>
          <input type="text" id="investor">
        </div>
        <div class="form-group">
          <label>Obrađivač</label>
          <input type="text" id="obradivac">
        </div>
        <div class="form-group">
          <label>Potpisnik</label>
          <input type="text" id="potpisnik">
        </div>
        <div class="form-group">
          <label>Datum prijema</label>
          <input type="date" id="datum_prijema">
        </div>
        <div class="form-group">
          <label>Rok datum</label>
          <input type="date" id="rok_datum">
        </div>
        <div class="form-group">
          <label>Status</label>
          <select id="status">
            <option value="U radu">U radu</option>
            <option value="Završen">Završen</option>
            <option value="Na čekanju">Na čekanju</option>
          </select>
        </div>
        <div class="form-group">
          <label>CEOP broj</label>
          <input type="text" id="ceop_broj">
        </div>
        <div class="form-group">
          <label>ROP broj</label>
          <input type="text" id="rop_broj">
        </div>
        <div class="form-group">
          <label>Opština</label>
          <input type="text" id="opstina">
        </div>
        <div class="form-group">
          <label>Katastarska opština</label>
          <input type="text" id="katastarska_opstina">
        </div>
        <div class="form-group">
          <label>Broj parcele</label>
          <input type="text" id="broj_parcele">
        </div>
        <div class="form-group">
          <label>Nadležni organ</label>
          <input type="text" id="nadlezni_organ">
        </div>
        <div class="form-group">
          <label>Slika/Dokument (Base64)</label>
          <input type="file" id="slikaFile" accept="image/*">
          <input type="hidden" id="slika_base64">
        </div>
        <div class="form-group full-width">
          <label>Napomena</label>
          <textarea id="napomena" rows="2"></textarea>
        </div>
      </div>

      <div class="btn-container">
        <button type="submit" class="btn-primary">Sačuvaj predmet</button>
        <button type="button" class="btn-secondary" onclick="resetForma()">Očisti formu</button>
      </div>
    </form>
  </div>

  <div class="card">
    <input type="text" id="search" class="search-box" placeholder="Pretraži predmete..." onkeyup="filtriraj()">
    <div style="overflow-x: auto;">
      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Interni br.</th>
            <th>Naziv</th>
            <th>Investitor</th>
            <th>Obrađivač</th>
            <th>Rok</th>
            <th>Status</th>
            <th>Akcije</th>
          </tr>
        </thead>
        <tbody id="tabelaTelo"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  let SVI_PREDMETI = [];

  document.addEventListener('DOMContentLoaded', ucitajPredmete);

  document.getElementById('slikaFile').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(evt) {
        document.getElementById('slika_base64').value = evt.target.result;
      };
      reader.readAsDataURL(file);
    }
  });

  async function ucitajPredmete() {
    try {
      const res = await fetch('/api/predmeti');
      SVI_PREDMETI = await res.json();
      prikaziTabelu(SVI_PREDMETI);
    } catch (err) {
      console.error('Greška pri učitavanju:', err);
    }
  }

  function prikaziTabelu(podaci) {
    const tbody = document.getElementById('tabelaTelo');
    tbody.innerHTML = '';
    podaci.forEach(p => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${p.id}</td>
        <td>${p.interni_broj || ''}</td>
        <td><b>${p.naziv_predmeta || ''}</b></td>
        <td>${p.investor || ''}</td>
        <td>${p.obradivac || ''}</td>
        <td>${p.rok_datum || ''}</td>
        <td>${p.status || ''}</td>
        <td>
          <button class="btn-secondary" style="padding:4px 8px;" onclick="izmeni(${p.id})">Izmeni</button>
          <button class="btn-danger" style="padding:4px 8px;" onclick="obrisi(${p.id})">Obriši</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  document.getElementById('predmetForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const payload = {
      id: document.getElementById('predmetId').value || null,
      vrsta_predmeta: document.getElementById('vrsta_predmeta').value,
      interni_broj: document.getElementById('interni_broj').value,
      naziv_predmeta: document.getElementById('naziv_predmeta').value,
      investor: document.getElementById('investor').value,
      obradivac: document.getElementById('obradivac').value,
      potpisnik: document.getElementById('potpisnik').value,
      datum_prijema: document.getElementById('datum_prijema').value,
      rok_datum: document.getElementById('rok_datum').value,
      status: document.getElementById('status').value,
      ceop_broj: document.getElementById('ceop_broj').value,
      rop_broj: document.getElementById('rop_broj').value,
      opstina: document.getElementById('opstina').value,
      katastarska_opstina: document.getElementById('katastarska_opstina').value,
      broj_parcele: document.getElementById('broj_parcele').value,
      nadlezni_organ: document.getElementById('nadlezni_organ').value,
      slika_base64: document.getElementById('slika_base64').value,
      napomena: document.getElementById('napomena').value
    };

    try {
      const res = await fetch('/api/predmeti', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (data.success) {
        resetForma();
        ucitajPredmete();
      }
    } catch (err) {
      alert('Greška pri čuvanju');
    }
  });

  function izmeni(id) {
    const p = SVI_PREDMETI.find(item => item.id === id);
    if (!p) return;
    document.getElementById('predmetId').value = p.id;
    document.getElementById('vrsta_predmeta').value = p.vrsta_predmeta || '';
    document.getElementById('interni_broj').value = p.interni_broj || '';
    document.getElementById('naziv_predmeta').value = p.naziv_predmeta || '';
    document.getElementById('investor').value = p.investor || '';
    document.getElementById('obradivac').value = p.obradivac || '';
    document.getElementById('potpisnik').value = p.potpisnik || '';
    document.getElementById('datum_prijema').value = p.datum_prijema || '';
    document.getElementById('rok_datum').value = p.rok_datum || '';
    document.getElementById('status').value = p.status || 'U radu';
    document.getElementById('ceop_broj').value = p.ceop_broj || '';
    document.getElementById('rop_broj').value = p.rop_broj || '';
    document.getElementById('opstina').value = p.opstina || '';
    document.getElementById('katastarska_opstina').value = p.katastarska_opstina || '';
    document.getElementById('broj_parcele').value = p.broj_parcele || '';
    document.getElementById('nadlezni_organ').value = p.nadlezni_organ || '';
    document.getElementById('slika_base64').value = p.slika_base64 || '';
    document.getElementById('napomena').value = p.napomena || '';
  }

  async function obrisi(id) {
    if (!confirm('Da li ste sigurni da želite da obrišete ovaj predmet?')) return;
    try {
      const res = await fetch('/api/obrisi', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id })
      });
      const data = await res.json();
      if (data.success) ucitajPredmete();
    } catch (err) {
      alert('Greška pri brisanju');
    }
  }

  function resetForma() {
    document.getElementById('predmetForm').reset();
    document.getElementById('predmetId').value = '';
    document.getElementById('slika_base64').value = '';
  }

  function filtriraj() {
    const q = document.getElementById('search').value.toLowerCase();
    const filtrirano = SVI_PREDMETI.filter(p => 
      (p.naziv_predmeta && p.naziv_predmeta.toLowerCase().includes(q)) ||
      (p.investor && p.investor.toLowerCase().includes(q)) ||
      (p.interni_broj && p.interni_broj.toLowerCase().includes(q))
    );
    prikaziTabelu(filtrirano);
  }
</script>
</body>
</html>
